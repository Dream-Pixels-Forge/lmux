name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            libgtk-3-dev \
            libvte-2.91-dev \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-vte-2.91 \
            gir1.2-gtk-3.0 \
            gir1.2-glib-2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build core library
        run: node scripts/build-core.mjs

      - name: Build CLI binary
        run: node scripts/build-cli.mjs

      - name: Run unit tests
        run: node scripts/test.mjs --unit

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            python3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build with ASan/UBSan
        run: node scripts/build-core.mjs --sanitize

      # The CLI binary must be built as well: test.mjs --unit includes a
      # "CLI help works" case that shells out to build/lmux, which only
      # exists once build-cli.mjs has run. Without this step the job died
      # with "CLI test FAILED (exit 127)" before it exercised any C code.
      - name: Build CLI with ASan/UBSan
        run: node scripts/build-cli.mjs --sanitize

      - name: Run tests with sanitizers
        run: node scripts/test.mjs --sanitize --unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            cppcheck

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build core (for header analysis)
        run: node scripts/build-core.mjs

      - name: Run cppcheck static analysis
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c17 \
            --suppress=missingIncludeSystem \
            -I include \
            src/core/*.c \
            src/cli/*.c \
            2>&1 | tee cppcheck-output.txt
          if grep -q "error:" cppcheck-output.txt; then
            echo "::error::cppcheck found errors"
            exit 1
          fi

      - name: Check for common issues
        run: |
          # Check for TODO/FIXME/HACK comments
          if grep -rn "TODO\|FIXME\|HACK\|XXX" src/ include/ --include="*.c" --include="*.h"; then
            echo "::warning::Found TODO/FIXME/HACK comments"
          fi

  packaging:
    runs-on: ubuntu-latest
    needs: [build-and-test, sanitizers]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            libgtk-3-dev \
            libvte-2.91-dev \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-vte-2.91 \
            gir1.2-gtk-3.0 \
            gir1.2-glib-2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all
        run: node scripts/build-core.mjs && node scripts/build-cli.mjs

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmux-deb
          path: dist/deb/*.deb
          retention-days: 30

  # Root-cause fix for #31: all three of its defects (dead --build-arg, pip
  # without network in the sandbox, wheel tags for a Python the SDK does not
  # ship) survived because nothing ever ran flatpak-builder against this
  # manifest — `test_ci_builds_the_flatpak_manifest` in tests/ pins that this
  # job keeps existing.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote (user installation)
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # The GNOME Platform + SDK are ~1.5 GB. The manifest is the only thing
      # that pins the runtime version, so key on it with a fallback: a bump
      # of runtime-version cold-starts once, everything else reuses the SDK.
      - name: Cache GNOME runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ hashFiles('packaging/io.github.lmux.lmux.yml') }}
          restore-keys: |
            flatpak-

      - name: Build the flatpak manifest
        run: |
          flatpak-builder --user --force-clean \
            --install-deps-from=flathub \
            --repo=build/flatpak/repo \
            build/flatpak/build-dir \
            packaging/io.github.lmux.lmux.yml

      - name: Install and smoke-test the built flatpak
        run: |
          flatpak install --user build/flatpak/repo io.github.lmux.lmux -y
          flatpak run io.github.lmux.lmux --version
