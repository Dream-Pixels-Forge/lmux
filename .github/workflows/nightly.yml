name: Nightly Build
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC daily

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            pkg-config \
            libgtk-3-dev \
            libvte-2.91-dev \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-vte-2.91 \
            gir1.2-gtk-3.0 \
            gir1.2-glib-2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate nightly version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT=$(echo $GITHUB_SHA | cut -c1-7)
          echo "VERSION=0.1.0-nightly.${DATE}.${SHORT}" >> $GITHUB_OUTPUT

      - name: Build release binaries
        run: node scripts/build-core.mjs && node scripts/build-cli.mjs

      - name: Run tests
        run: node scripts/test.mjs --unit

      - name: Run sanitizer tests
        run: |
          rm -f build/*.o build/*.a
          node scripts/test.mjs --sanitize --unit

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nightly ${{ steps.version.outputs.VERSION }}"
          tag_name: nightly
          generate_release_notes: true
          files: |
            dist/deb/*.deb
            build/lmux
          draft: false
          prerelease: true
