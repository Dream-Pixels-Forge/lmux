name: Container Signing

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write  # for keyless OIDC signing

jobs:
  sign:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image (keyless)
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_branch }}"
          cosign sign --yes "$IMAGE" || echo "Image not found — skipping sign"
